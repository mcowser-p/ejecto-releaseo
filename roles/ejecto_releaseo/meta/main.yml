---
galaxy_info:
  namespace: mcowser_p
  role_name: ejecto_releaseo
  author: mcowser-p
  description: >-
    Deploy files from a GitHub branch or release onto Linux and Windows
    hosts, then restart a service or run a command
  license: Apache-2.0
  min_ansible_version: '2.16'

  platforms:
    - name: EL
      versions:
        - '9'
        - '10'
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Windows
      versions:
        - '2022'

  galaxy_tags:
    - deployment
    - github
    - release
    - windows

dependencies: []
