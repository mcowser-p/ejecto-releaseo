---
- name: Verify
  hosts: all
  tasks:
    - name: Run the deployed jq
      ansible.builtin.command:
        cmd: /usr/local/bin/jq --version
      register: ejecto_releaseo_jq_out
      changed_when: false

    - name: Assert jq is executable and sane
      ansible.builtin.assert:
        that: ejecto_releaseo_jq_out.stdout is match('jq-')

    - name: Stat the deployed branch tree
      ansible.builtin.stat:
        path: /opt/hello/README
      register: ejecto_releaseo_hello_readme

    - name: Assert the branch tree landed
      ansible.builtin.assert:
        that: ejecto_releaseo_hello_readme.stat.exists
