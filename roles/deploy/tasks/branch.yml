---
# Branch mode: land the repository tree at a ref on the target.
#
# With token/app/anonymous auth the tree comes from the tarball/zipball API.
# With a deploy key the repo is cloned on the CONTROLLER over SSH (deploy
# keys speak git, not the REST API) and the selected paths are pushed to the
# target with copy/win_copy — which works for both OS families.

- name: Deploy via the archive API
  when: presto_deployo_auth != 'deploy_key'
  block:
    - name: Create a staging directory on the controller
      delegate_to: localhost
      become: false
      check_mode: false
      ansible.builtin.tempfile:
        state: directory
        prefix: presto-deployo-
      register: _presto_deployo_stage

    - name: Download the repository archive
      delegate_to: localhost
      become: false
      check_mode: false
      ansible.builtin.get_url:
        url: >-
          https://api.github.com/repos/{{ presto_deployo_repo_owner }}/{{ presto_deployo_repo_name
          }}/tarball/{{ presto_deployo_version if presto_deployo_version != 'latest' else 'HEAD' }}
        headers: "{{ _presto_deployo_headers }}"
        dest: "{{ _presto_deployo_stage.path }}/repo.tar.gz"
        mode: "0600"

    - name: Unpack the archive on the controller
      delegate_to: localhost
      become: false
      check_mode: false
      ansible.builtin.unarchive:
        src: "{{ _presto_deployo_stage.path }}/repo.tar.gz"
        dest: "{{ _presto_deployo_stage.path }}"
        extra_opts: ["--strip-components=1"]

- name: Deploy via a deploy key
  when: presto_deployo_auth == 'deploy_key'
  block:
    - name: Require the key
      ansible.builtin.assert:
        that: presto_deployo_deploy_key | length > 0
        fail_msg: deploy_key auth needs presto_deployo_deploy_key (path to the private key)

    - name: Create a staging directory on the controller
      delegate_to: localhost
      become: false
      check_mode: false
      ansible.builtin.tempfile:
        state: directory
        prefix: presto-deployo-
      register: _presto_deployo_stage

    - name: Shallow-clone over SSH with the deploy key
      delegate_to: localhost
      become: false
      check_mode: false
      ansible.builtin.git:
        repo: "git@github.com:{{ presto_deployo_repo_owner }}/{{ presto_deployo_repo_name }}.git"
        dest: "{{ _presto_deployo_stage.path }}"
        version: "{{ presto_deployo_version if presto_deployo_version != 'latest' else 'HEAD' }}"
        depth: 1
        key_file: "{{ presto_deployo_deploy_key }}"
        accept_newhostkey: true

- name: Select the paths to ship
  ansible.builtin.set_fact:
    _presto_deployo_ship: >-
      {{ presto_deployo_paths
         if presto_deployo_paths | length > 0
         else [{'path': '.', 'dest': presto_deployo_dest}] }}

- name: Copy tree to the target (linux)
  become: true
  when: ansible_os_family != 'Windows'
  ansible.builtin.copy:
    src: "{{ _presto_deployo_stage.path }}/{{ item.path }}{{ '' if item.path.endswith('/') or item.path == '.' else '' }}"
    dest: "{{ item.dest | default(presto_deployo_dest) }}"
    owner: "{{ presto_deployo_owner }}"
    group: "{{ presto_deployo_group }}"
    mode: "preserve"
  loop: "{{ _presto_deployo_ship }}"
  notify:
    - Restart service (linux)

- name: Copy tree to the target (windows)
  when: ansible_os_family == 'Windows'
  ansible.windows.win_copy:
    src: "{{ _presto_deployo_stage.path }}/{{ item.path }}"
    dest: "{{ item.dest | default(presto_deployo_dest) }}"
  loop: "{{ _presto_deployo_ship }}"
  notify:
    - Restart service (windows)

- name: Remove the controller staging directory
  delegate_to: localhost
  become: false
  check_mode: false
  ansible.builtin.file:
    path: "{{ _presto_deployo_stage.path }}"
    state: absent
