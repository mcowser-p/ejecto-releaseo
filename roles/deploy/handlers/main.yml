---
- name: Restart service (linux)
  become: true
  ansible.builtin.systemd_service:
    name: "{{ presto_deployo_service }}"
    state: restarted
  when: ansible_os_family != 'Windows'

- name: Restart service (windows)
  ansible.windows.win_service:
    name: "{{ presto_deployo_service }}"
    state: restarted
  when: ansible_os_family == 'Windows'
