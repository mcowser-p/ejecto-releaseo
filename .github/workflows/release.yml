---
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ansible-core provides ansible-galaxy for the collection build/publish
      # that @semantic-release/exec runs (see .releaserc.js).
      - name: Install ansible-core (pinned)
        run: pip install -r requirements.txt

      # Pinned in package.json; Dependabot keeps the pins updated.
      - name: Install semantic-release toolchain
        run: npm install

      # Recorded before the release so the next step can tell whether
      # semantic-release actually cut a new version.
      - name: Record the current release tag
        id: before
        run: |
          echo "tag=$(git describe --tags --abbrev=0 \
            --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo none)" \
            >> "$GITHUB_OUTPUT"

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}

      # This repo is also consumed as a GitHub Action
      # (`uses: mcowser-p/ejecto-releaseo@v1`), so the floating major tag has
      # to follow each release — otherwise Action users stay pinned to
      # whatever commit the tag was first cut at. semantic-release only
      # manages the exact vX.Y.Z tag, so move vX here.
      - name: Move the floating major tag
        run: |
          git fetch --tags --force
          new=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
          if [ "$new" = "${{ steps.before.outputs.tag }}" ]; then
            echo "No new release this run — leaving the major tag as is."
            exit 0
          fi
          major=${new%%.*}
          echo "Moving $major -> $new"
          git tag -f "$major" "$new^{commit}"
          git push --force origin "refs/tags/$major"
