---
name: Deploy tracking probe

# Temporary: verifies the action's opt-in deployment tracking files a record
# and moves it in_progress -> success. Removed once confirmed.
on: workflow_dispatch

permissions:
  contents: read
  deployments: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: printf 'localhost ansible_connection=local\n' > /tmp/inv
      - uses: ./
        with:
          inventory: /tmp/inv
          environment: probe-tracking
          environment_url: https://example.invalid/probe
          repo_owner: jqlang
          repo_name: jq
          version: jq-1.7.1
          dest: /usr/local/bin
          auth: none
          assets: |
            - name: jq-linux-amd64
              rename: jq
