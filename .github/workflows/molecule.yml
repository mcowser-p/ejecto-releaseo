---
# Molecule / integration tests — three gates keep this from running on
# every push:
#
#   1. Path filter: only role, test, or workflow changes trigger it. Docs,
#      README, and release-machinery churn never do.
#   2. Label gate: the Windows job (slower, WinRM setup on a windows-latest
#      runner) additionally requires the `test-windows` label on the PR.
#   3. workflow_dispatch: both jobs can be forced manually; the Windows job
#      via the run_windows input.
#
# Superseded runs on the same ref are cancelled (concurrency), so rapid
# pushes don't stack runners.
name: Molecule

on:
  pull_request:
    branches: [main]
    paths:
      - 'roles/**'
      - 'tests/**'
      - 'requirements.yml'
      - 'requirements.txt'
      - '.github/workflows/molecule.yml'
  push:
    branches: [main]
    paths:
      - 'roles/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      run_windows:
        description: Also run the Windows job
        type: boolean
        default: false

concurrency:
  group: molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling (pinned)
        run: pip install -r requirements.txt

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Molecule test
        run: molecule test
        working-directory: roles/ejecto_releaseo
        env:
          # Picked up by the role's auto auth — also keeps the shared-runner
          # anonymous API rate limit from flaking the tests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  windows:
    runs-on: windows-latest
    # Gate: PR label `test-windows`, or a manual dispatch with run_windows.
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'test-windows')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_windows)
    steps:
      - uses: actions/checkout@v4

      - name: Configure WinRM, OpenSSH and the test user on the runner
        shell: pwsh
        run: |
          $pw = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 24 | ForEach-Object {[char]$_}) + "aA1!"
          New-LocalUser -Name ansible-test -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Administrators -Member ansible-test
          "ANSIBLE_TEST_PW=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # WinRM transport
          Enable-PSRemoting -Force -SkipNetworkProfileCheck
          Set-Item WSMan:\localhost\Service\Auth\Basic -Value $true
          Set-Item WSMan:\localhost\Service\AllowUnencrypted -Value $true
          New-NetFirewallRule -DisplayName "WinRM-WSL" -Direction Inbound -LocalPort 5985 -Protocol TCP -Action Allow | Out-Null
          # SSH transport (Windows OpenSSH server, PowerShell as default shell)
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force | Out-Null
          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          New-NetFirewallRule -DisplayName "SSH-WSL" -Direction Inbound -LocalPort 22 -Protocol TCP -Action Allow | Out-Null

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3-pip python3-venv sshpass

      - name: Install ansible in WSL
        shell: wsl-bash {0}
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install --quiet "ansible-core==2.21.3" pywinrm
          ~/venv/bin/ansible-galaxy collection install -r requirements.yml

      - name: Run the Windows deploy test (WinRM)
        shell: wsl-bash {0}
        run: |
          HOST_IP=$(ip route show default | awk '{print $3}')
          cat > inventory-winrm.ini <<INV
          [windows]
          winhost ansible_host=$HOST_IP
          [windows:vars]
          ansible_user=ansible-test
          ansible_password=$ANSIBLE_TEST_PW
          ansible_connection=winrm
          ansible_port=5985
          ansible_winrm_transport=basic
          ansible_winrm_server_cert_validation=ignore
          INV
          ANSIBLE_ROLES_PATH=roles ~/venv/bin/ansible-playbook -i inventory-winrm.ini tests/windows/deploy.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WSLENV: ANSIBLE_TEST_PW/u:GITHUB_TOKEN/u

      - name: Run the Windows deploy test (SSH)
        shell: wsl-bash {0}
        run: |
          HOST_IP=$(ip route show default | awk '{print $3}')
          cat > inventory-ssh.ini <<INV
          [windows]
          winhost ansible_host=$HOST_IP
          [windows:vars]
          ansible_user=ansible-test
          ansible_password=$ANSIBLE_TEST_PW
          ansible_connection=ssh
          ansible_shell_type=powershell
          ansible_ssh_common_args=-o StrictHostKeyChecking=no
          INV
          ANSIBLE_ROLES_PATH=roles ~/venv/bin/ansible-playbook -i inventory-ssh.ini tests/windows/deploy.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WSLENV: ANSIBLE_TEST_PW/u:GITHUB_TOKEN/u

  # Exercises the composite action end to end against a localhost inventory,
  # deploying a real public release. Deployment tracking is deliberately not
  # switched on here: it would file a record in the Deployments tab on every
  # PR, and the tracking path is covered separately.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write a localhost inventory
        run: |
          printf 'localhost ansible_connection=local\n' > /tmp/smoke-inventory

      - name: Run the composite action against itself
        uses: ./
        with:
          inventory: /tmp/smoke-inventory
          repo_owner: jqlang
          repo_name: jq
          version: jq-1.7.1
          dest: /usr/local/bin
          auth: none
          assets: |
            - name: jq-linux-amd64
              rename: jq

      - name: Assert the binary landed and runs
        run: |
          test -x /usr/local/bin/jq
          /usr/local/bin/jq --version | grep -q '^jq-1.7.1$'

      - name: Rerun is a no-op (version marker)
        uses: ./
        with:
          inventory: /tmp/smoke-inventory
          repo_owner: jqlang
          repo_name: jq
          version: jq-1.7.1
          dest: /usr/local/bin
          auth: none
          assets: |
            - name: jq-linux-amd64
              rename: jq
