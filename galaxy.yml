---
# Ansible Galaxy collection manifest for mcowser_p.presto_deployo.
#
# `version` is a placeholder — semantic-release stamps the released version
# here at release time (see .releaserc.js) before building the collection
# artifact. Do not bump it by hand.
namespace: mcowser_p
name: presto_deployo
version: 0.0.0
readme: README.md
authors:
  - mcowser-p
description: >-
  Presto! Deployo! — deploy files from a GitHub branch or release onto
  Linux and Windows hosts, then restart a service or run a command.
  Authenticates with a deploy key, PAT, GitHub App, or the ambient
  GITHUB_TOKEN when run from a workflow.
license:
  - Apache-2.0
tags:
  - deployment
  - github
  - release
  - windows
  - linux
  - infrastructure
dependencies:
  community.general: '>=8.0.0'
  ansible.windows: '>=2.0.0'
  community.windows: '>=2.0.0'
repository: https://github.com/mcowser-p/presto-deployo
homepage: https://github.com/mcowser-p/presto-deployo
issues: https://github.com/mcowser-p/presto-deployo/issues
build_ignore:
  - .github
  - .git
  - .gitignore
  - .releaserc.js
  - .ansible-lint
  - .yamllint
  - package.json
  - package-lock.json
  - node_modules
  - requirements.txt
  - '*.tar.gz'
